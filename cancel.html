<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>결제 취소 · Stargate Edu</title>
<style>body{margin:0;font-family:Inter,'Pretendard','Noto Sans KR',system-ui,sans-serif;background:#F7F9FC;color:#1A2233;display:grid;min-height:100vh;place-items:center}.box{max-width:660px;margin:20px;background:#fff;border:1px solid #E4E7EC;border-radius:20px;padding:42px;text-align:center;box-shadow:0 16px 42px rgba(11,42,74,.08)}.icon{font-size:48px}h1{color:#0B2A4A;margin:12px 0 8px}p{color:#667085}.detail{margin:18px 0 0;padding:12px;border-radius:9px;background:#fff8e6;color:#765b00;font-size:13px;word-break:break-word}.btn{display:inline-block;margin-top:20px;padding:13px 24px;border-radius:9px;background:#C9A227;color:#3a2e00;text-decoration:none;font-weight:800}.retry{margin-left:8px;background:#0B2A4A;color:#fff}</style></head>
<body><main class="box"><div class="icon">↩</div><h1 id="title">결제가 완료되지 않았습니다</h1><p id="message">취소했거나 결제 인증 과정에서 오류가 발생했습니다. 승인 완료 전에는 최종 결제로 처리되지 않습니다.</p><div class="detail" id="detail"></div><a class="btn" id="home" href="./">쇼핑몰로 돌아가기</a><a class="btn retry" id="retry" href="./">다시 시도</a></main>
<script>(function(){
  var p=new URLSearchParams(location.search);var en=p.get("lang")==="en";var code=p.get("code")||"PAYMENT_NOT_COMPLETED";var msg=p.get("message")||"";var orderId=p.get("orderId")||"";var product=p.get("product")||"";
  document.documentElement.lang=en?"en":"ko";
  if(en){document.title="Payment not completed · Stargate Edu";document.getElementById("title").textContent="Payment not completed";document.getElementById("message").textContent="The payment was cancelled or authentication failed. It is not treated as complete until final approval succeeds.";document.getElementById("home").textContent="Return to the shop";document.getElementById("retry").textContent="Try again";document.getElementById("home").href="./en/";}
  document.getElementById("detail").textContent=(en?"Code: ":"오류 코드: ")+code+(orderId?" · "+orderId:"")+(msg?" · "+msg:"");
  document.getElementById("retry").href="./checkout.html?product="+encodeURIComponent(product||"koi-algorithms-guide")+"&lang="+(en?"en":"ko");
})();</script></body></html>
